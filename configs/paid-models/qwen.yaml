# Tiny smoke run of qwen3.7-plus through the gateway (the endpoint allows ~3,000 Qwen tokens in total):
# utility on the first 5 of the same 20 documents (same deterministic order), no noise floor, no LLM-detector
# run; the same claude-opus-5-5 judge as the other paid runs. Needs PII_SHIELD_ALLOW_PAID_MODELS=1 (see haiku.yaml).
#   OPENAI_API_KEY=<endpoint key> PII_SHIELD_ALLOW_PAID_MODELS=1 \
#     uv run pii-shield eval utility -c configs/paid-models/qwen.yaml
gold: data/gold/gold.jsonl
output_dir: results/paid-models/qwen
policy: support-chat

ner_model: knowledgator/gliner-pii-base-v1.0

utility:
  task: reply
  documents: 5
  domains: [support, email, chat]
  policy: support-chat
  max_tokens: 600             # token budget: 4 answers must fit in ~3,000 tokens
  noise_floor: false
  model:
    provider: openai
    model: qwen3.7-plus
    fallback_models: []
    base_url: http://127.0.0.1:8787/v1
  judge:
    provider: openai
    model: claude-opus-5-5
    fallback_models: []
    base_url: http://127.0.0.1:8787/v1

llm_detector:                 # not run for Qwen (token budget); set so the config holds no free-model default
  provider: openai
  model: qwen3.7-plus
  fallback_models: []
  base_url: http://127.0.0.1:8787/v1

require_free_models: false
max_calls: 16                 # counted over the whole ledger, both invocations
min_seconds_between_requests: 0.5
