name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_LINK_MODE: copy

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      # No `ner` extra: torch is not needed to lint or typecheck (gliner/torch imports are lazy).
      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check src tests

      - name: Ruff format check
        run: uv run ruff format --check src tests

      - name: mypy (strict)
        run: uv run mypy

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      # No API keys and no model downloads: NER tests are skipped unless the GLiNER model is cached locally,
      # the gateway runs against the deterministic fake upstream, Redis is fakeredis.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest --junitxml=report.xml

      - name: Gold set is up to date with its hand-written source
        run: |
          uv run pii-shield gold build --output /tmp/gold.jsonl
          cmp /tmp/gold.jsonl data/gold/gold.jsonl

      - name: CLI smoke run (patterns only)
        run: echo "Mail anna.petrova@gmail.com, card 4111 1111 1111 1111" | uv run pii-shield redact --no-ner

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-report
          path: report.xml

  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Default image: gateway + NER runtime (CPU torch). The NER model itself is downloaded on first start,
      # so CI never downloads model weights.
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: pii-shield:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
